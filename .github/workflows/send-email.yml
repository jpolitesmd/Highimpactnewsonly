# Sends the editions (email/today.json, scheduled for its send_at time) and BREAKING alerts
# (email/breaking.json, sent at once) to subscribers through Buttondown; see tools/send_email.py.
# Each email goes out once, to everyone except subscribers with that email's "Skip ..." tag. The Buttondown API key lives in the repo secret BUTTONDOWN_API_KEY.
name: Send edition email

on:
  push:
    branches: [main]
    paths: ["email/today.json", "email/breaking.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: send-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send via Buttondown (each email once)
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python3 tools/send_email.py

      - name: Record send
        if: always()
        run: |
          if ! git diff --quiet -- email/sent.txt 2>/dev/null || [ -n "$(git status --porcelain email/sent.txt)" ]; then
            git config user.name "High Impact News Daily"
            git config user.email "jpolitesmd@users.noreply.github.com"
            git add email/sent.txt
            git commit -m "Email sent $(TZ=America/New_York date +%F)"
            git pull --rebase && git push
          fi
